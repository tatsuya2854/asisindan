<style>
:root{
  --white:#FFFFFF;
  --ivory:#FDFAF8;          /* ほぼ白のベース */
  --pearl:#F8F2ED;          /* シャンパンベージュ */
  --champagne:#E9DCCF;
  --pink:#F7DDE3;           /* ペールピンク */
  --pink-d:#D99AAB;         /* くすみローズ */
  --plum:#584A4E;           /* 文字（黒を使わない） */
  --plum-soft:rgba(88,74,78,.62);
  --gold:#A08770;           /* ベージュ系のアクセント */
  --ink:#3F3336;
  --line:rgba(88,74,78,.13);
  --serif:"Shippori Mincho","Hiragino Mincho ProN",serif;
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:var(--round);color:var(--plum);
  background:#EFDDE0;
  display:flex;align-items:center;justify-content:center;
  overscroll-behavior:none;
}
#app{
  position:relative;width:390px;height:800px;max-width:100vw;max-height:100dvh;
  background:
    radial-gradient(130% 78% at 50% -6%, #FFF9F8 0%, #FDF1EE 38%, #F7DFE2 100%);
  border-radius:26px;overflow:hidden;box-shadow:0 26px 70px rgba(88,74,78,.2);
  display:flex;flex-direction:column;
}
@media (max-width:430px){ #app{width:100vw;height:100dvh;border-radius:0;box-shadow:none} body{background:var(--ivory)} }

/* 背景の星屑 */
.stars{position:absolute;inset:0;pointer-events:none;opacity:.75}
.stars i{position:absolute;display:block;width:3px;height:3px;border-radius:50%;background:var(--champagne);animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.9;transform:scale(1.15)}}

/* ---------- 共通ヘッダー ---------- */
.bar{
  position:relative;z-index:5;flex:0 0 auto;
  padding:calc(10px + env(safe-area-inset-top)) 16px 6px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.mark{font-family:var(--serif);font-weight:800;font-size:13px;letter-spacing:.16em}
.mark span{display:block;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:10px;letter-spacing:.2em;color:var(--gold);font-weight:600}
.lang{
  display:flex;border:1.5px solid var(--line);border-radius:99px;overflow:hidden;background:#fff;
}
.lang button{
  appearance:none;border:0;background:none;font:inherit;font-weight:700;font-size:11px;
  padding:5px 11px;color:var(--plum-soft);cursor:pointer;letter-spacing:.06em;
}
.lang button[aria-pressed="true"]{background:var(--pink-d);color:#fff}

.screen{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;z-index:2}
.pad{padding:0 20px 26px}

/* ---------- キャラクター ---------- */
.mandala{
  display:block;width:min(320px,86%);height:auto;margin:8px auto 2px;
  animation:spinIn 1.1s cubic-bezier(.2,1,.4,1) both;
}
@keyframes spinIn{from{opacity:0;transform:scale(.9) rotate(-8deg)}}

.hero-card{
  position:relative;margin-top:10px;padding:8px 8px 6px;
  border:1.5px solid var(--line);border-radius:26px;overflow:hidden;
  background:linear-gradient(172deg,#FFFFFF 0%,#FCF4EF 52%,#F8E6EA 100%);
}
.hero-card .glow{
  position:absolute;left:50%;top:54%;width:270px;height:270px;transform:translate(-50%,-50%);
  border-radius:50%;background:radial-gradient(circle,rgba(247,221,227,.95),rgba(247,221,227,0) 70%);
}
.hero-card .cr{position:absolute;bottom:4px;right:12px;filter:drop-shadow(0 4px 10px rgba(88,74,78,.28))}
.emb{display:block;border-radius:50%;filter:drop-shadow(0 3px 8px rgba(88,74,78,.18))}
.hero-card .cd{position:absolute;top:16px;left:16px;z-index:2;text-shadow:0 1px 6px rgba(255,255,255,.8);font-family:"Cormorant Garamond",serif;font-style:italic;font-size:12px;letter-spacing:.3em;color:var(--gold)}
.figure{
  display:block;width:100%;height:auto;            /* 切り抜かない。元の正方形のまま出す */
  border-radius:20px;border:1px solid rgba(255,255,255,.7);
  box-shadow:0 12px 28px rgba(88,74,78,.22);
  background:#F5EBE6;opacity:0;transition:opacity .3s ease;
}
.figure.ready{opacity:1}
.tagline{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.tagline span{
  background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:99px;
  padding:4px 11px;font-size:10.5px;font-weight:700;color:var(--plum-soft);
}


/* 図鑑グリッド：顔とファッションが見えるように上寄せで大きく切る */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.gcell{
  background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:0;overflow:hidden;
  cursor:pointer;font:inherit;color:inherit;text-align:center;
}
.gcell.me{border-color:var(--pink-d);box-shadow:0 6px 18px rgba(217,154,171,.25)}
.gcell .thumb{position:relative;width:100%;overflow:hidden;background:#F5EBE6;line-height:0}
.gcell .thumb img{display:block;width:100%;height:auto;opacity:0;transition:opacity .3s ease}
.gcell .thumb img.ready{opacity:1}
.gcell .thumb .badge{
  position:absolute;top:7px;left:7px;background:var(--pink-d);color:#fff;border-radius:99px;
  padding:2px 8px;font-size:9px;font-weight:900;letter-spacing:.08em;
}
.gcell .cap{padding:8px 6px 10px}
.gcell b{display:block;font-family:var(--serif);font-size:12px;line-height:1.4}
.gcell i{display:block;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:9px;letter-spacing:.16em;color:var(--gold);margin-top:3px}

/* キャラ詳細 */
.detail{
  width:100%;max-width:340px;background:linear-gradient(172deg,#FFFFFF,#FCF3EF 55%,#F8E6EA);
  border-radius:24px;padding:16px 16px 18px;text-align:center;position:relative;
  animation:up .35s cubic-bezier(.2,1.2,.4,1);
}
.detail .figure{border-radius:16px}
.detail h3{font-family:var(--serif);font-weight:800;font-size:21px;margin:8px 0 2px}
.detail .dcode{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:11px;letter-spacing:.3em;color:var(--gold)}
.detail .dcatch{font-size:12px;line-height:1.7;color:var(--plum-soft);margin:8px 4px 0}

/* ---------- タイトル画面 ---------- */
.hero{text-align:center;padding-top:6px}
.hero .lead{font-size:11.5px;letter-spacing:.18em;color:var(--gold);font-weight:700;margin-bottom:10px}
.hero h1{
  font-family:var(--serif);font-weight:800;font-size:31px;line-height:1.34;margin:0 0 4px;
  letter-spacing:.03em;
}
.hero h1 em{font-style:normal;color:var(--pink-d)}
.hero .sub{font-size:12.5px;line-height:1.75;color:var(--plum-soft);margin:10px 0 0}
.rule{display:flex;align-items:center;gap:10px;margin:16px 0 12px;color:var(--gold)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--champagne),transparent)}
.chips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.chip{
  border:1.5px solid var(--champagne);background:#fff;border-radius:99px;
  padding:5px 12px;font-size:11px;font-weight:700;color:var(--plum-soft);
}
.cta{
  position:relative;width:100%;margin-top:20px;appearance:none;border:0;cursor:pointer;
  font-family:var(--serif);font-weight:800;font-size:17px;letter-spacing:.08em;color:#fff;
  background:linear-gradient(135deg,#C79FAC,#A87C8B);
  border-radius:var(--r);padding:16px;box-shadow:0 8px 20px rgba(168,124,139,.35);
  overflow:hidden;
}
.cta::after{
  content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  animation:shine 3.4s ease-in-out infinite;
}
@keyframes shine{0%{left:-60%}45%{left:120%}100%{left:120%}}

 SKAG:{key:"emma",ja:{n:"エマ・ポメ",m:"ポメラニアン",s:"甘えん坊・淡色韓国ストリート",c:"よく笑って、よく動く、甘えん坊なポメラニアン。",t:"生活リズムも気分も整ってる。いちばん難しいところ、できてるよ。\nあとは夕方の脚の重さだけ。あれ、ほとんど塩と水分のせいなんだ。\nしょっぱいおやつを甘いものに変える日を、週に2回つくってみて。"},en:{n:"Emma Pome",m:"Pomeranian",s:"Soft-tone street",c:"A cheerful pomeranian who laughs and moves a lot.",t:"Your rhythm and your mood are steady — that's the hardest part.\nAll that's left is the heavy evening feeling: mostly salt and water.\nSwap salty snacks for something sweet twice a week."}},
 SYNT:{key:"lilia",ja:{n:"リリア・フェネック",m:"フェネック",s:"おっとり知性系",c:"頭はいつも動いている、考えごとが好きな子。",t:"ちゃんと考えて選べる人。それは大きな才能だよ。\nでも座ったままの時間が長いと、脚だけ置いていかれちゃう。\n1時間に1回、立ってかかとを20回上げ下げ。読書の合間でいいからね。"},en:{n:"Lilia Fennec",m:"Fennec fox",s:"Quiet and clever",c:"A thoughtful girl whose mind never stops.",t:"You think before you choose — that's a real gift.\nBut sitting for hours leaves your legs behind.\nOnce an hour, stand up and do twenty heel raises. Between chapters is fine."}},
 SYNG:{key:"rico",ja:{n:"ペガサス・リコ",m:"ペガサス",s:"自由人・ポジティブ系",c:"自由に飛びたい、夢見がちなペガサス。",t:"マイペースでいられるのって、実はすごく強いことなんだよ。\nただ、脚のめぐりが今おやすみ中。夕方に重く感じない？\n夜、湯船で足首をゆっくり10回まわしてみて。それだけでいい。"},en:{n:"Pegasus Rico",m:"Pegasus",s:"Free and positive",c:"A dreamy pegasus who wants to fly free.",t:"Staying at your own pace takes more strength than people think.\nBut your circulation is napping. Do your legs feel heavy by evening?\nTonight, roll your ankles ten times in the bath. That's all."}},
 SYAT:{key:"stella",ja:{n:"ステラ・ベア",m:"クマ",s:"ストイック・クール系",c:"決めたルールは必ず守る、努力家のクマ。",t:"ルールを守り切れる人って、本当に少ない。誇っていいよ。\nでも我慢を増やしても脚は軽くならないの。足りないのは動かす時間。\n今日はスクワット10回だけ。がんばる向きを変えるだけでいい。"},en:{n:"Stella Bear",m:"Bear",s:"Stoic and cool",c:"A disciplined bear who never breaks her own rules.",t:"Very few people can actually keep their rules. Be proud of that.\nBut more restraint won't lighten your legs — movement will.\nTen squats today. Just point that effort somewhere new."}},
 SYAG:{key:"bambi",ja:{n:"バンビ・アンジュ",m:"小鹿",s:"上品・フェミニン系",c:"朝がいちばんきれいな、上品な小鹿。",t:"朝は調子いいのに、夕方には脚が別人…って感じない？\n立ちっぱなし・座りっぱなしの日は、水分が下に溜まっちゃうの。\n帰ったらすぐ、脚を心臓より高くして5分。これが一番効くよ。"},en:{n:"Bambi Ange",m:"Fawn",s:"Elegant and feminine",c:"An elegant fawn who looks her best in the morning.",t:"Great in the morning, different legs by evening — sound familiar?\nOn long standing or sitting days, fluid pools at the bottom.\nGet home, lie down, legs above your heart, five minutes. Best thing you can do."}},
 FKNT:{key:"vivi",ja:{n:"ヴィヴィ・ヴォルテ",m:"キツネ",s:"知略・クール系",c:"夜まで走り切る、頭の切れるキツネ。",t:"食事も運動もきちんとできてる。正直、直すところが見つからない。\n足りないのは睡眠だけ。むくみは寝ている間にしか抜けないんだ。\n今日は30分だけ早くベッドに入ろう。それがあなたの伸びしろ。"},en:{n:"Vivi Volte",m:"Fox",s:"Sharp and cool",c:"A sharp fox who runs until the night ends.",t:"Your food and training are both solid. I can't find a flaw.\nThe only gap is sleep — puffiness only clears while you rest.\nGo to bed thirty minutes earlier tonight. That's your upside."}},
 FKNG:{key:"mei",ja:{n:"パンダ・メイ",m:"パンダ",s:"ゆるふわ・マイペース系",c:"夜ふかしでも、ちゃんと整えているパンダ。",t:"マイペースなのに脚がきれい。それ、続けてる証拠だよ。\n夜に少しでも動いたりケアしてるでしょ？その習慣がちゃんと効いてる。\n今のままでいい。寝る前の10分だけは、これからも手放さないで。"},en:{n:"Panda Mei",m:"Panda",s:"Easygoing",c:"A panda who stays up late but still takes care of herself.",t:"Easygoing, yet your legs look good. That's consistency showing.\nYou move or stretch a little at night, don't you? It's working.\nChange nothing. Just never give up those ten minutes before bed."}},
 FKAT:{key:"piyo",ja:{n:"ピヨ・エクリュ",m:"ひよこ",s:"フレッシュ・元気系",c:"朝いちばんに動き出す、まっすぐなひよこ。",t:"食事も運動も朝型も完璧。優等生すぎて心配になるくらい！\n気をつけたいのは、頑張りすぎて疲れが抜けない日。\n週に1日だけ、なにも管理しない日をつくろう。それも立派なケアだよ。"},en:{n:"Piyo Écru",m:"Chick",s:"Fresh and bright",c:"An honest chick who is up and moving first.",t:"Food, training, early mornings — flawless. Almost worryingly so!\nThe risk is the day your tiredness stops clearing.\nTake one day a week with zero rules. That counts as care too."}},

 FYNT:{key:"mieu",ja:{n:"ネズミ・ミュー",m:"ネズミ",s:"コツコツ・努力家系",c:"こつこつ積み上げるのが得意な、努力家のネズミ。",t:"食べ方がすごくきれい。記録も続けられるタイプでしょ？\n足りないのは動く時間だけ。脚は使わないと形が出ないんだ。\n今日はエレベーターを1回だけ階段に。小さく積むのが得意なあなたなら続く。"},en:{n:"Mieu Mouse",m:"Mouse",s:"Steady and diligent",c:"A diligent mouse who builds things little by little.",t:"Your eating is beautiful. You're the type who keeps records, right?\nThe only gap is movement — legs need use to take shape.\nTake the stairs once today. You're good at small, steady wins."}},

 FYAT:{key:"mellow",ja:{n:"メロウ・シープ",m:"ヒツジ",s:"癒やし・穏やか系",c:"暮らしを丁寧に整えている、穏やかなヒツジ。",t:"早寝も食事も整ってる。ここまでできてる人、ほとんどいないよ。\nあとは筋肉だけ。脚は使ってあげないと、細くても疲れやすいんだ。\n明日からスクワット10回。朝の習慣にくっつけると続くよ。"},en:{n:"Mellow Sheep",m:"Sheep",s:"Calm and soothing",c:"A calm sheep who tends her days carefully.",t:"Early nights, good meals — almost nobody gets this far.\nAll that's missing is muscle. Unused legs tire easily, even slim ones.\nTen squats from tomorrow. Attach it to a morning habit and it sticks."}},
 FYAG:{key:"noelle",ja:{n:"ノエル・ラパン",m:"うさぎ",s:"明るく元気なY2K韓国ストリート",c:"暮らしは整った。あとは跳ねるだけのうさぎ。",t:"食事も生活リズムもいい感じ。いちばん大変なところ、もう終わってる。\n残ってるのは動くことだけ。3分でいいの、ほんとに。\n好きな曲を1曲ぶん、部屋で踊ってみて。それで今日のケアは合格。"},en:{n:"Noelle Lapin",m:"Rabbit",s:"Bright Y2K street",c:"A rabbit whose life is in order — now she just has to hop.",t:"Food and rhythm are good. The hard part is already done.\nAll that's left is moving, and three minutes is enough.\nDance to one song in your room. That's today's care, done."}}

/* 相性表 */
function matchOf(code){
  return code.split("").map(function(ch,i){
    return [["S","F"],["K","Y"],["N","A"],["T","G"]][i].filter(function(x){return x!==ch;})[0];
  }).join("");
}

/* ============================================================
   5. 状態
   ============================================================ */
var step=-1, answers=[], result=null;
var runs = saved.runs || 0;
var AD_EVERY = 1;                    /* PR枠を出す頻度。1=毎回、3なら3回に1回 */
var AD_URL = "https://amzn.to/4bkhWjp";
function adCard(){
  if(AD_EVERY > 1 && runs % AD_EVERY !== 1) return "";
  return '<a class="ad" href="'+AD_URL+'" target="_blank" rel="noopener sponsored">'+
           '<span class="pr">'+L("adPr")+'</span>'+
           '<b>'+L("adTitle")+'</b><span>'+L("adBody")+'</span>'+
           '<em>'+L("adCta")+' →</em></a>';
}
var $=function(id){return document.getElementById(id);};
var screen=$("screen"), sheet=$("sheet"), sheetIn=$("sheetIn");

function toast(t){ var e=$("toast"); e.textContent=t; e.classList.add("on"); setTimeout(function(){e.classList.remove("on");},1700); }
// 画像がキャッシュ済みだと onload が来ずに透明のままになることがあるので、描画後に必ず確認する
function markReady(){
  var im = screen.querySelectorAll("img.figure, .thumb img, .shotimg img");
  Array.prototype.forEach.call(im, function(g){ if(g.complete && g.naturalWidth>0) g.classList.add("ready"); });
  var im2 = sheetIn.querySelectorAll("img.figure, .shotimg img");
  Array.prototype.forEach.call(im2, function(g){
    if(g.complete && g.naturalWidth>0) g.classList.add("ready");
    else g.addEventListener("load", function(){ g.classList.add("ready"); });
  });
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

/* 星屑 */
(function(){
  var st=$("stars"), h="";
  for(var i=0;i<26;i++){
    h+='<i style="left:'+(Math.random()*98).toFixed(1)+'%;top:'+(Math.random()*96).toFixed(1)+'%;animation-delay:'+(Math.random()*3.4).toFixed(2)+'s"></i>';
  }
  st.innerHTML=h;
})();

   6. 画面
   ============================================================ */
function renderIntro(){
  step=-1;
  screen.innerHTML =
   '<div class="pad fadein"><div class="hero">'+
     '<div class="lead">'+L("lead")+'</div>'+
     '<h1>'+L("h1")+'</h1>'+
     ORNAMENT+
     '<p class="sub">'+L("sub")+'</p>'+
     '<div class="rule"></div>'+
     '<div class="chips"><span class="chip">'+L("chip1")+'</span><span class="chip">'+L("chip2")+'</span><span class="chip">'+L("chip3")+'</span></div>'+
     '<button class="cta" id="startBtn">'+L("start")+'</button>'+
     '<button class="ghost" id="codexBtn">'+L("codex")+'</button>'+
   '</div></div>';
  $("startBtn").onclick=function(){ answers=[]; step=0; renderQ(); };
  $("codexBtn").onclick=function(){ renderCodex(); };
}

/* タイトル画面の飾り */
var ORNAMENT = '<img class="mandala" src="' + MANDALA + '" alt="" aria-hidden="true">';

function renderQ(){
  var q=Q[step], t=q[LANG], pct=Math.round(step/Q.length*100);
  screen.innerHTML =
   '<div class="prog"><div class="track"><i style="width:'+pct+'%"></i></div>'+
     '<div class="meta"><span>'+L("qOf").replace("{n}",step+1).replace("{t}",Q.length)+'</span><span>'+pct+'%</span></div></div>'+
   '<div class="pad fadein">'+
     '<div class="qcat">'+IC[q.ic[2]]+L("cat."+q.ax)+'</div>'+
     '<h2 class="qtext">'+esc(t.q)+'</h2>'+
     t.a.map(function(a,i){
       return '<button class="opt" data-i="'+i+'"><span class="ic">'+IC[q.ic[i]]+'</span><span class="tx">'+esc(a)+'</span></button>';
     }).join("")+
     (step>0 ? '<button class="back" id="backBtn">'+L("back")+'</button>' : '')+
   '</div>';
  Array.prototype.forEach.call(screen.querySelectorAll(".opt"), function(b){
    b.onclick=function(){
      b.classList.add("on");
      answers[step]=Q[step].w[+b.dataset.i];
      setTimeout(function(){
        step++;
        if(step>=Q.length) renderCalc(); else renderQ();
        screen.scrollTop=0;
      }, 190);
    };
  });
  if($("backBtn")) $("backBtn").onclick=function(){ step--; renderQ(); };
}

function score(){
  var sc={water:0,muscle:0,rhythm:0,mind:0};
  Q.forEach(function(q,i){ sc[q.ax]+=(answers[i]||0); });
  var code = (sc.water>0?"F":"S")+(sc.muscle>0?"K":"Y")+(sc.rhythm>0?"A":"N")+(sc.mind>0?"G":"T");
  var pct={};
  for(var k in sc){ pct[k]=Math.round((sc[k]+3)/6*100); }
  return {code:code, sc:sc, pct:pct};
}

function renderCalc(){
  screen.innerHTML='<div class="calc"><div class="orb"></div><p>'+L("calc")+'</p></div>';
  var pre=score();
  var warm=new Image(); warm.src=imgURL(pre.code);      // 計算中に結果画像を先読み
  setTimeout(function(){
    result=pre; runs++;
    store.save({lang:LANG, code:result.code, pct:result.pct, runs:runs});
    renderResult();
  }, 1500);
}

function axisRow(k, v){
  return '<div class="axis"><div class="lb"><span>'+L("cat."+k)+'</span><b>'+L("axisName."+k)+' '+v+'</b></div>'+
         '<div class="tr"><i style="width:'+v+'%"></i></div></div>';
}

function tipsFor(r){
  var ks=Object.keys(r.sc).sort(function(a,b){return r.sc[a]-r.sc[b];});
  return [TIPS[ks[0]][r.sc[ks[0]]>0?"high":"low"][LANG],
          TIPS[ks[1]][r.sc[ks[1]]>0?"high":"low"][LANG],
          TIPS[ks[3]][r.sc[ks[3]]>0?"high":"low"][LANG]];
}

function figureTag(code, cls){
  var t=TYPES[code][LANG];
  return '<img class="'+(cls||"figure")+'" src="'+imgURL(code)+'" alt="'+esc(t.n)+'" width="1100" height="1100"'+
         ' fetchpriority="high" onload="this.classList.add(\'ready\')">';
}
function renderResult(){
  var r=result, ty=TYPES[r.code][LANG], m=matchOf(r.code), mt=TYPES[m][LANG];
  screen.innerHTML =
   '<div class="pad fadein">'+
    '<div class="hero-card"><div class="glow"></div>'+
      '<span class="cd">'+r.code+'</span><span class="cr">'+icon(r.code,52)+'</span>'+
      figureTag(r.code)+
    '</div>'+
    '<div class="rtype" style="margin-top:12px"><div class="code">'+L("resultTitle")+'</div>'+
      '<h2>'+esc(ty.n)+'</h2><p class="catch">'+esc(ty.c)+'</p>'+
      '<div class="tagline"><span>'+esc(ty.m)+'</span><span>'+esc(ty.s)+'</span></div></div>'+
    '<div class="bubble"><b class="who">'+L("naruSays")+'</b>'+esc(ty.t).replace(/\n/g,"<br>")+'</div>'+
    '<div class="card"><h3>'+L("axisTitle")+'</h3>'+
      axisRow("water",r.pct.water)+axisRow("muscle",r.pct.muscle)+axisRow("rhythm",r.pct.rhythm)+axisRow("mind",r.pct.mind)+
    '</div>'+
    '<div class="card"><h3>'+L("tipsTitle")+'</h3><ul class="tips">'+
      tipsFor(r).map(function(t,i){return '<li><span class="n">'+(i+1)+'</span><span>'+esc(t)+'</span></li>';}).join("")+
    '</ul></div>'+
    '<div class="card"><h3>'+L("matchTitle")+'</h3><button class="match" id="matchBtn" style="border:0;background:none;padding:0;width:100%;cursor:pointer;text-align:left">'+
      '<span class="mc" style="display:block">'+icon(m,56)+'</span>'+
      '<span class="mt"><b>'+esc(mt.n)+'</b>'+esc(mt.c)+'</span></button></div>'+
    adCard()+
    '<button class="cta" id="shareBtn">'+L("share")+'</button>'+
    '<button class="ghost" id="codexBtn2">'+L("codex")+'</button>'+
    '<button class="ghost" id="againBtn">'+L("again")+'</button>'+
   '</div>';
  markReady();
  $("shareBtn").onclick=openShare;
  $("againBtn").onclick=renderIntro;
  $("codexBtn2").onclick=renderCodex;
  $("matchBtn").onclick=function(){ openDetail(m); };
}
function iconBox(code){ return '<div style="text-align:center;margin-top:6px">'+icon(code,118)+'</div>'; }

function renderCodex(){
  var mine = result ? result.code : (saved.code||null);
  screen.innerHTML =
   '<div class="pad fadein"><h2 class="qtext" style="margin-bottom:4px">'+L("codexTitle")+'</h2>'+
   '<p class="catch" style="font-size:12px;color:var(--plum-soft);margin:0 0 8px">'+L("codexSub")+'</p>'+
   '<div class="grid">'+ Object.keys(TYPES).map(function(c){
      var t=TYPES[c][LANG];
      return '<button class="gcell'+(c===mine?" me":"")+'" data-c="'+c+'">'+
             '<span class="thumb">'+(c===mine?'<span class="badge">'+L("you")+'</span>':'')+
             '<img src="'+imgURL(c,1)+'" alt="'+esc(t.n)+'" loading="lazy" decoding="async" width="420" height="420"'+
             ' onload="this.classList.add(\'ready\')"></span>'+
             '<span class="cap"><b>'+esc(t.n)+'</b><i>'+c+'</i></span></button>';
    }).join("")+'</div>'+
   '<button class="ghost" id="homeBtn" style="margin-top:14px">'+(result?L("again"):L("start"))+'</button></div>';
  Array.prototype.forEach.call(screen.querySelectorAll(".gcell"), function(b){
    b.onclick=function(){ openDetail(b.getAttribute("data-c")); };
  });
  markReady();
  $("homeBtn").onclick=function(){ answers=[]; step=0; renderQ(); };
}

/* キャラクター詳細 */
function openDetail(code){
  var t=TYPES[code][LANG], mine = result && result.code===code;
  sheetIn.innerHTML =
   '<div class="detail" id="detail">'+
     (mine?'<div class="code" style="color:var(--pink-d);font-family:var(--round);font-size:10.5px;letter-spacing:.16em;font-weight:800">'+L("you")+'</div>':'')+
     figureTag(code)+
     '<h3>'+esc(t.n)+'</h3><div class="dcode">'+code+'</div>'+
     '<div class="tagline"><span>'+esc(t.m)+'</span><span>'+esc(t.s)+'</span></div>'+
     '<p class="dcatch">'+esc(t.c)+'</p>'+
     '<div class="bubble" style="text-align:left"><b class="who">'+L("naruSays")+'</b>'+esc(t.t).replace(/\n/g,"<br>")+'</div>'+
     '<div style="margin-top:12px">'+icon(code,62)+'</div>'+
     '<button class="ghost" id="dClose" style="margin-top:10px">'+L("close")+'</button>'+
   '</div>';
  $("dClose").onclick=closeShare;
  sheet.classList.add("on"); sheetIn.scrollTop=0; markReady();
}
/* ---------- シェアカード ---------- */
function openShare(){
  var r=result, ty=TYPES[r.code][LANG];
  var bars=[["water",r.pct.water],["muscle",r.pct.muscle],["rhythm",r.pct.rhythm],["mind",r.pct.mind]].map(function(p){
    return '<div class="r"><span class="k">'+L("axisName."+p[0])+'</span><span class="t"><i style="width:'+p[1]+'%"></i></span><span class="v">'+p[1]+'</span></div>';
  }).join("");
  sheetIn.innerHTML =
   '<div class="shot" id="shot"><div class="frame"></div><div class="inner">'+
     '<div class="top">'+L("brandSub")+'</div>'+
     '<div class="shotimg"><img class="figure" src="'+imgURL(r.code)+'" alt="'+esc(ty.n)+'" onload="this.classList.add(\'ready\')"></div>'+
     '<div class="nameRow">'+icon(r.code,40).replace('class="emb"','class="emb shotEmb"')+
       '<div><h2>'+esc(ty.n)+'</h2><div class="code2">'+r.code+'</div></div></div>'+
     '<p class="cat2">'+esc(ty.c)+'</p>'+
     '<div class="bars">'+bars+'</div>'+
     '<div class="foot"><span class="tag">'+L("tag")+'<span>'+L("resultTitle")+'</span></span>'+
       '<svg class="qr" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#6B585D"/>'+
       '<path d="M8 9h5v5H8zM19 9h5v5h-5zM8 18h5v5H8zM18 18h2v2h-2zM22 18h2v2h-2zM20 20h2v2h-2zM18 22h2v2h-2zM22 22h2v2h-2z" fill="#fff"/></svg>'+
     '</div>'+
   '</div></div>'+
   '<p class="hint">'+L("shotHint")+'</p>'+
   '<div class="srow"><a class="x" id="xBtn" target="_blank" rel="noopener">'+L("shareX")+'</a>'+
     '<button class="cp" id="cpBtn">'+L("copy")+'</button>'+
     '<button class="cl" id="clBtn">'+L("close")+'</button></div>';
  var text=L("shareText").replace("{name}", ty.n).replace("{catch}", ty.c);
  $("xBtn").href="https://twitter.com/intent/tweet?text="+encodeURIComponent(text)+"&url="+encodeURIComponent(location.href.split("#")[0]);
  $("cpBtn").onclick=function(){
    var t=text+" "+location.href.split("#")[0];
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){toast(L("copied"));},function(){toast(L("copyFail"));});
    } else { toast(L("copyFail")); }
  };
  $("clBtn").onclick=closeShare;
  sheet.classList.add("on"); sheetIn.scrollTop=0; markReady();
}
function closeShare(){ sheet.classList.remove("on"); }
sheet.addEventListener("click", function(e){ if(e.target===sheet || e.target===sheetIn) closeShare(); });
$("xbtn").onclick=closeShare;
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeShare(); });

/* ---------- 言語切り替え ---------- */
function setLang(l){
  LANG=l;
  document.documentElement.lang=l;
  document.title=L("docTitle");
  $("markTitle").innerHTML=L("brand")+"<span>"+L("brandSub")+"</span>";
  $("langJa").setAttribute("aria-pressed", String(l==="ja"));
  $("langEn").setAttribute("aria-pressed", String(l==="en"));
  store.save({lang:l, code:(result?result.code:saved.code), pct:(result?result.pct:saved.pct), runs:runs});
  if(sheet.classList.contains("on")){ openShare(); return; }
  if(step===-1) renderIntro();
  else if(result) renderResult();
  else renderQ();
}
$("langJa").onclick=function(){ setLang("ja"); };
$("langEn").onclick=function(){ setLang("en"); };

/* ---------- 起動 ---------- */
setLang(LANG);

window.__witch={
  types:TYPES, questions:Q, icon:icon,
  answer:function(i){ answers[step]=Q[step].w[i]; },
  setAnswers:function(arr){ answers=arr.slice(); },
  scoreNow:function(){ return score(); },
  go:function(n){ step=n; renderQ(); },
  runs:function(n){ if(n!=null) runs=n; return runs; },
  result:function(){ return result; },
  setResult:function(r){ result=r; renderResult(); },
  lang:function(){ return LANG; },
  share:openShare, codex:renderCodex, intro:renderIntro, detail:openDetail, img:imgURL
};
})();
</script>
</body>
</html>
