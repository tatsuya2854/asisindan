<style>
:root{
  --white:#FFFFFF;
  --ivory:#FDFAF8;          /* ほぼ白のベース */
  --pearl:#F8F2ED;          /* シャンパンベージュ */
  --champagne:#E9DCCF;
  --pink:#F7DDE3;           /* ペールピンク */
  --pink-d:#D99AAB;         /* くすみローズ */
  --plum:#584A4E;           /* 文字（黒を使わない） */
  --plum-soft:rgba(88,74,78,.62);
  --gold:#A08770;           /* ベージュ系のアクセント */
  --ink:#3F3336;
  --line:rgba(88,74,78,.13);
  --serif:"Shippori Mincho","Hiragino Mincho ProN",serif;
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:var(--round);color:var(--plum);
  background:#EFE7E1;
  display:flex;align-items:center;justify-content:center;
  overscroll-behavior:none;
}
#app{
  position:relative;width:390px;height:800px;max-width:100vw;max-height:100dvh;
  background:
    radial-gradient(120% 70% at 50% -8%, #FFFFFF 0%, var(--ivory) 42%, #F6EDE6 100%);
  border-radius:26px;overflow:hidden;box-shadow:0 26px 70px rgba(88,74,78,.2);
  display:flex;flex-direction:column;
}
@media (max-width:430px){ #app{width:100vw;height:100dvh;border-radius:0;box-shadow:none} body{background:var(--ivory)} }

/* 背景の星屑 */
.stars{position:absolute;inset:0;pointer-events:none;opacity:.75}
.stars i{position:absolute;display:block;width:3px;height:3px;border-radius:50%;background:var(--champagne);animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.9;transform:scale(1.15)}}

/* ---------- 共通ヘッダー ---------- */
.bar{
  position:relative;z-index:5;flex:0 0 auto;
  padding:calc(10px + env(safe-area-inset-top)) 16px 6px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.mark{font-family:var(--serif);font-weight:800;font-size:13px;letter-spacing:.16em}
.mark span{display:block;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:10px;letter-spacing:.2em;color:var(--gold);font-weight:600}
.lang{

.hero-card{

}
.hero-card .glow{
  position:absolute;left:50%;top:54%;width:270px;height:270px;transform:translate(-50%,-50%);

}

.gcell .thumb .badge{

}

}

.hero .sub{font-size:12.5px;line-height:1.75;color:var(--plum-soft);margin:10px 0 0}

}

}
.cta::after{
  content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;

}

@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 結果画面 ---------- */
.crest{width:118px;height:118px;margin:0 auto;display:block;filter:drop-shadow(0 8px 16px rgba(74,44,61,.18))}
.rtype{text-align:center;margin-top:6px}

.shot .bars .t{flex:1;height:7px;border-radius:99px;background:rgba(74,44,61,.1);overflow:hidden}

.shot .shotimg{
  position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;border-radius:16px;margin:11px 0 2px;

/* 相性表 */
function matchOf(code){
  return code.split("").map(function(ch,i){
    return [["S","F"],["K","Y"],["N","A"],["T","G"]][i].filter(function(x){return x!==ch;})[0];
  }).join("");

/* 紋章：4軸の組み合わせから16通りを描き分ける */
var crestSeq=0;
function crest(code, size){
  var uid = code+"-"+(++crestSeq);
  var salt = code[0]==="S", hard = code[1]==="K", night = code[2]==="N", strict = code[3]==="T";
  var bg1 = night ? "#F6EFF2" : "#FDF7F1", bg2 = night ? "#EBDCE3" : "#F3E5D6";
  var accent = salt ? "#E3AAB8" : "#AECBBF";
  var band = strict ? "#8C7378" : "#C6A88F";
  var sym = hard
    ? '<path d="M50 34c8 0 12 7 12 14 0 9-5 14-12 20-7-6-12-11-12-20 0-7 4-14 12-14z" fill="'+accent+'" stroke="#6B585D" stroke-width="2.4" stroke-linejoin="round"/><path d="M50 40v20" stroke="#6B585D" stroke-width="2.2" stroke-linecap="round"/>'
    : '<circle cx="50" cy="50" r="15" fill="'+accent+'" stroke="#6B585D" stroke-width="2.4"/><path d="M42 50c3-4 5-4 8 0s5 4 8 0" fill="none" stroke="#6B585D" stroke-width="2.2" stroke-linecap="round"/>';
  var top = night
    ? '<path d="M56 16a8 8 0 1 1-9.5-8 6.4 6.4 0 0 0 9.5 8z" fill="#F5E9DA" stroke="#6B585D" stroke-width="2.2" stroke-linejoin="round"/>'
    : '<circle cx="50" cy="14" r="6.5" fill="#F5E9DA" stroke="#6B585D" stroke-width="2.2"/><path d="M50 3.5v3M50 21.5v3M39.5 14h3M57.5 14h3" stroke="#6B585D" stroke-width="2" stroke-linecap="round"/>';
  return '<svg viewBox="0 0 100 100" width="'+(size||100)+'" height="'+(size||100)+'" aria-hidden="true">'+
    '<defs><linearGradient id="g'+uid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+bg1+'"/><stop offset="1" stop-color="'+bg2+'"/></linearGradient></defs>'+
    '<path d="M50 26 82 36v22c0 16-14 26-32 32-18-6-32-16-32-32V36z" fill="url(#g'+uid+')" stroke="#6B585D" stroke-width="3" stroke-linejoin="round"/>'+
    '<path d="M19 70h62" stroke="'+band+'" stroke-width="3.4" stroke-linecap="round" opacity=".85"/>'+
    '<g transform="translate(0,-6)">'+sym+'</g>' + top +
    (strict ? '<path d="M50 82v6" stroke="#6B585D" stroke-width="2.4" stroke-linecap="round"/>' : '<circle cx="50" cy="85" r="3" fill="'+band+'"/>')+
  '</svg>';
}

function score(){
  var sc={water:0,muscle:0,rhythm:0,mind:0};
  Q.forEach(function(q,i){ sc[q.ax]+=(answers[i]||0); });
  var code = (sc.water>0?"F":"S")+(sc.muscle>0?"K":"Y")+(sc.rhythm>0?"A":"N")+(sc.mind>0?"G":"T");
  var pct={};
  for(var k in sc){ pct[k]=Math.round((sc[k]+3)/6*100); }
  return {code:code, sc:sc, pct:pct};
}

     '<div class="top">'+L("brandSub")+'</div><div class="ttl">'+L("resultTitle")+'</div>'+
     '<div class="shotimg"><img src="'+imgURL(r.code)+'" alt="'+esc(ty.n)+'" style="background-image:url('+BLUR[r.code]+');background-size:cover"></div>'+
     '<h2>'+esc(ty.n)+'</h2><div class="code2">'+r.code+'</div>'+
     '<p class="cat2">'+esc(ty.c)+'</p>'+
     '<div class="bars">'+bars+'</div>'+
     '<div style="margin-top:8px">'+crest(r.code,44).replace("<svg ",'<svg class="crestS" style="width:44px;height:44px" ')+'</div>'+
     '<div class="foot"><span class="tag">'+L("tag")+'<span>'+L("tagSub")+'</span></span>'+
       '<svg class="qr" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#6B585D"/>'+
       '<path d="M8 9h5v5H8zM19 9h5v5h-5zM8 18h5v5H8zM18 18h2v2h-2zM22 18h2v2h-2zM20 20h2v2h-2zM18 22h2v2h-2zM22 22h2v2h-2z" fill="#fff"/></svg>'+
     '</div>'+
   '</div></div>'+
   '<p class="hint">'+L("shotHint")+'</p>'+
   '<div class="srow"><a class="x" id="xBtn" target="_blank" rel="noopener">'+L("shareX")+'</a>'+
     '<button class="cp" id="cpBtn">'+L("copy")+'</button>'+
     '<button class="cl" id="clBtn">'+L("close")+'</button></div>';
  var text=L("shareText").replace("{name}", ty.n);
  $("xBtn").href="https://twitter.com/intent/tweet?text="+encodeURIComponent(text)+"&url="+encodeURIComponent(location.href.split("#")[0]);
  $("cpBtn").onclick=function(){
    var t=text+" "+location.href.split("#")[0];
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){toast(L("copied"));},function(){toast(L("copyFail"));});
    } else { toast(L("copyFail")); }
  };
  $("clBtn").onclick=closeShare;
  sheet.classList.add("on");
}
function closeShare(){ sheet.classList.remove("on"); }
sheet.addEventListener("click", function(e){ if(e.target===sheet) closeShare(); });
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeShare(); });

/* ---------- 言語切り替え ---------- */
function setLang(l){
  LANG=l;
  document.documentElement.lang=l;
  document.title=L("docTitle");
  $("markTitle").innerHTML=L("brand")+"<span>"+L("brandSub")+"</span>";
  $("langJa").setAttribute("aria-pressed", String(l==="ja"));
  $("langEn").setAttribute("aria-pressed", String(l==="en"));
  store.save({lang:l, code:(result?result.code:saved.code), pct:(result?result.pct:saved.pct)});
  if(sheet.classList.contains("on")){ openShare(); return; }
  if(step===-1) renderIntro();
  else if(result) renderResult();
  else renderQ();
}
$("langJa").onclick=function(){ setLang("ja"); };
$("langEn").onclick=function(){ setLang("en"); };

/* ---------- 起動 ---------- */
setLang(LANG);

window.__witch={
  types:TYPES, questions:Q, crest:crest,
  answer:function(i){ answers[step]=Q[step].w[i]; },
  setAnswers:function(arr){ answers=arr.slice(); },
  scoreNow:function(){ return score(); },
  go:function(n){ step=n; renderQ(); },
  result:function(){ return result; },
  setResult:function(r){ result=r; renderResult(); },
  lang:function(){ return LANG; },
  share:openShare, codex:renderCodex, intro:renderIntro, detail:openDetail, img:imgURL, blur:function(c){return BLUR[c];}
};
})();
</script>
